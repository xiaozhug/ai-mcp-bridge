server:
  port: 8082

spring:
  application:
    name: enterprise-solution-server

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
#        enabled: false
    consul:
      enabled: false
      host: 127.0.0.1
      port: 8500
      discovery:
        hostname: 127.0.0.1
    zookeeper:
      enabled: false
      connect-string: 127.0.0.1:2181

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:12346/eureka/
    enabled: false
  instance:
    instance-id: ${spring.application.name}:${random.int}

mcp:
#  registry: eureka
#  registry: zookeeper
  registry: consul
#  registry: nacos

endpoint:
  mianshiya:
    searchQuestion: https://api.mianshiya.com/api/question/mcp/search
    resultLink: https://www.mianshiya.com/question/%s
